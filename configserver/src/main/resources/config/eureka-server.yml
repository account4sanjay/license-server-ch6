# Shared settings for every Eureka peer. Each container activates one of the
# profiles peer1, peer2 or peer3 (see eureka-server-peer*.yml), which sets the
# instance hostname and the URLs of the other two peers.
spring:
  application:
    name: eureka-server
  boot:
    admin:
      context-path: /admin
server:
  port: 8070
eureka:
  instance:
    preferIpAddress: false
  client:
    # In a highly-available cluster each Eureka server registers with its peers
    # and fetches their registries, so every peer holds the full registry.
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://eurekaserver1:8070/eureka/,http://eurekaserver2:8070/eureka/,http://eurekaserver3:8070/eureka/
  server:
    waitTimeInMsWhenSyncEmpty: 5
    enableSelfPreservation: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
